<template>
    <div class={containerClasses}>
        <div class="form-header">
            <div class="contact-title-wrapper">
                <i class="fas fa-envelope-open-text"></i>
                <h1 class="contact-title">Get in Touch</h1>
            </div>
            <a href="mailto:hello@anudeepappikatla.com" class="contact-email">
                <i class="fas fa-envelope"></i>
                hello@anudeepappikatla.com
            </a>
            <p class="contact-subtitle">
                Got an exciting project or just want to connect?
                Drop me a message below.
            </p>
        </div>
        <div class="form-divider"></div>
        <form onsubmit={handleSubmit} class="contact-form">
            <div class="toast-wrapper">
                <components-toast-service></components-toast-service>
            </div>
            
            <div class="form-group name-field">
                <label for="name">
                    <i class="fas fa-user"></i>
                    <span>Name</span>
                    <span class="required">*</span>
                </label>
                <input 
                    type="text" 
                    id="name" 
                    name="name" 
                    required 
                    placeholder="Enter your full name"
                    value={formData.name}
                    onchange={handleInputChange}
                    disabled={isFormDisabled}
                />
                <div if:true={formState.errors.name} class="error-message">
                    {formState.errors.name}
                </div>
            </div>

            <div class="form-group">
                <label for="email">
                    <i class="fas fa-envelope"></i>
                    <span>Email</span>
                    <span class="required">*</span>
                </label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    required 
                    placeholder="your.email@example.com"
                    value={formData.email}
                    onchange={handleInputChange}
                    disabled={isFormDisabled}
                />
                <div if:true={formState.errors.email} class="error-message">
                    {formState.errors.email}
                </div>
            </div>

            <div class="form-group">
                <label for="subject">
                    <i class="fas fa-tag"></i>
                    <span>Subject</span>
                </label>
                <input 
                    type="text" 
                    id="subject" 
                    name="subject" 
                    placeholder="What's this about?"
                    value={formData.subject}
                    onchange={handleInputChange}
                    disabled={isFormDisabled}
                />
            </div>

            <div class="form-group">
                <label for="message">
                    <i class="fas fa-comment-alt"></i>
                    <span>Message</span>
                    <span class="required">*</span>
                </label>
                <textarea 
                    id="message" 
                    name="message" 
                    required 
                    placeholder="Type your message here..."
                    rows="5"
                    value={formData.message}
                    onchange={handleInputChange}
                    disabled={isFormDisabled}
                ></textarea>
                <div if:true={formState.errors.message} class="error-message">
                    {formState.errors.message}
                </div>
            </div>

            <div class="honeypot-field">
                <input 
                    type="text" 
                    name="website" 
                    value={formData.website}
                    onchange={handleInputChange}
                />
            </div>

            <button 
                type="submit" 
                class="submit-button"
                disabled={isFormDisabled}
            >
                <template if:true={formState.isSubmitting}>
                    <i class="fas fa-spinner fa-spin"></i>
                    <span>Sending...</span>
                </template>
                <template if:false={formState.isSubmitting}>
                    <i class="fas fa-paper-plane"></i>
                    <span>Send Message</span>
                </template>
            </button>
        </form>
    </div>
</template>
