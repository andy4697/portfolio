<template>
    <div class="form-container">
      <!-- Success/Error Messages -->
      <template if:true={isSuccess}>
        <div class="notification success-notification" role="alert">
          <div class="notification-content">
            <span class="notification-icon">✓</span>
            <h2>Thank you! Your message has been sent successfully.</h2>
          </div>
          <button class="close-button" title="Close" onclick={closeNotification}>×</button>
        </div>
      </template>
      
      <template if:true={isError}>
        <div class="notification error-notification" role="alert">
          <div class="notification-content">
            <span class="notification-icon">!</span>
            <h2>There was an error sending your message. Please try again.</h2>
          </div>
          <button class="close-button" title="Close" onclick={closeNotification}>×</button>
        </div>
      </template>
      
      <!-- Contact Form -->
      <form onsubmit={handleSubmit} class="contact-form">
        <!-- Name Field -->
        <!-- <div class="form-element">
          <label class="form-label" for="name">
            <span class="required-indicator">*</span> Name
          </label>
          <div class="form-control">
            <input type="text" 
                   id="name" 
                   name="name" 
                   required 
                   class="form-input" 
                   placeholder="Your name"
                   value={name}
                   onchange={handleInputChange} />
          </div>
        </div> -->
        
        <!-- Email Field -->
        <div class="form-element">
          <label class="form-label" for="email">
            <span class="required-indicator">*</span> Email
          </label>
          <div class="form-control">
            <input type="email" 
                   id="email" 
                   name="email" 
                   required 
                   class="form-input" 
                   placeholder="Your email address"
                   value={email}
                   onchange={handleInputChange} />
          </div>
        </div>
        
        <!-- Subject Field -->
        <div class="form-element">
          <label class="form-label" for="subject">Subject</label>
          <div class="form-control">
            <input type="text" 
                   id="subject" 
                   name="subject" 
                   class="form-input" 
                   placeholder="Subject of your message"
                   value={subject}
                   onchange={handleInputChange} />
          </div>
        </div>
        
        <!-- Message Field -->
        <div class="form-element">
          <label class="form-label" for="message">
            <span class="required-indicator">*</span> Message
          </label>
          <div class="form-control">
            <textarea id="message" 
                      name="message" 
                      required 
                      class="form-textarea" 
                      placeholder="Your message"
                      rows="5"
                      value={message}
                      onchange={handleInputChange}></textarea>
          </div>
        </div>
        
        <!-- Honeypot field for spam protection -->
        <div class="honeypot-field">
          <input type="text" 
                 id="website" 
                 name="website" 
                 value={website}
                 onchange={handleInputChange} />
        </div>
        
        <!-- Submit Button -->
        <div class="form-element">
          <button type="submit" 
                  class="submit-button" 
                  disabled={isSubmitting}>
            <template if:true={isSubmitting}>
              <!-- SLDS Spinner -->
              <div class="slds-spinner slds-spinner_small slds-spinner_inline slds-m-right_x-small" role="status">
                <div class="slds-spinner__dot-a"></div>
                <div class="slds-spinner__dot-b"></div>
                <span class="slds-assistive-text">Loading</span>
              </div>
              Sending...
            </template>
            <template if:false={isSubmitting}>
              Send Message
            </template>
          </button>
        </div>
      </form>
    </div>
  </template>
