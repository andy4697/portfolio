<template>
    <div class="slds-scope">
        <div class="experience-container slds-p-around_large">
            <div class="slds-text-heading_large slds-m-bottom_large">Experience</div>

            <div class="timeline">
                <template for:each={experiences} for:item="job" for:index="index">
                    <div key={job.id} class="timeline-item slds-p-bottom_medium">
                        <div class="timeline-marker"></div>
                        <div class="slds-m-bottom_medium">
                            <div class="slds-text-heading_medium slds-text-color_default slds-m-bottom_x-small">{job.title}</div>
                            <div class="slds-text-body_small slds-text-color_weak slds-m-bottom_small">From {job.startDate} to {job.endDate} at {job.company}, {job.location}</div>
                            <div class="slds-text-body_regular">{job.description}</div>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </div>
</template>
