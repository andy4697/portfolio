<template>
    <div class="slds-scope">
        <div class="skills-container slds-p-around_large">
            <div class="slds-text-heading_large slds-m-bottom_large">Skills</div>
            
            <div class="skills-grid">
                <template for:each={skills} for:item="skill">
                    <div key={skill.id} class="skill-item">
                        <i class={skill.icon}></i>
                        <span class="skill-name">{skill.name}</span>
                    </div>
                </template>
            </div>
        </div>
    </div>
</template>
