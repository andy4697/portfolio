<template>
    <div class="slds-scope">
        <div class="education-container slds-p-around_large">
            <div class="slds-text-heading_large slds-m-bottom_large">Education</div>

            <div class="timeline">
                <template for:each={educations} for:item="edu" for:index="index">
                    <div key={edu.id} class="timeline-item slds-p-bottom_medium">
                        <div class="timeline-marker"></div>
                        <div class="slds-m-bottom_medium">
                            <div class="slds-text-heading_medium slds-text-color_default slds-m-bottom_x-small">{edu.title}</div>
                            <div class="slds-text-body_small slds-text-color_weak slds-m-bottom_small">
                                {edu.startYear} to {edu.endYear} at {edu.institution}, {edu.location}
                            </div>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </div>
</template>
